# Different websites on different interfaces and ports.
# 127.0.0.2 works on Linux, where all of 127.0.0.0/8 is loopback; macOS
# refuses to bind it unless the address is added to lo0.

server {
    listen 127.0.0.1:8080;
    root www;
    index index.html;
}

server {
    listen 127.0.0.1:8081;
    root www2;
    index index.html;
}

server {
    listen 127.0.0.2:8080;
    root www2;
    index index.html;
}

# All interfaces on its own port (0.0.0.0 cannot share a port with a
# specific address).
server {
    listen 8082;
    root www;
    index index.html;
}
