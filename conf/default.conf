# Demo configuration. Run from the repository root: ./webserv conf/default.conf
# Paths (root, alias, upload_store) are relative to that directory.

server {
    listen 127.0.0.1:8080;
    root www;
    index index.html;
    error_page 404 /errors/404.html;
    client_max_body_size 1m;

    # Static site, read only: no limit_except means GET and HEAD.
    location / {
    }

    # Directory listing.
    location /files/ {
        autoindex on;
    }

    # A route mapped to another directory; its index.html is served.
    location /docs/ {
        alias www/documents/;
    }

    # Redirection.
    location /old/ {
        return 301 /about.html;
    }

    # Uploads (multipart/form-data) and DELETE of what was uploaded.
    location /upload/ {
        limit_except GET POST DELETE { deny all; }
        upload_store www/upload;
        client_max_body_size 10m;
    }

    # CGI by extension.
    location /cgi-bin/ {
        limit_except GET POST { deny all; }
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
    }

    # Body size limit: echo.py with at most 64 bytes of body.
    location /limit/ {
        limit_except POST { deny all; }
        alias www/cgi-bin/;
        cgi .py /usr/bin/python3;
        client_max_body_size 64;
    }
}

# A second website on another port.
server {
    listen 127.0.0.1:8081;
    root www2;
    index index.html;
}
