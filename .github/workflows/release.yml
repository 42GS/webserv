name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach binaries (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-14
            target: darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Build and run unit tests
        run: |
          make
          make test

      - name: Package binary and runtime bundle
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          BINARY_NAME="webserv-${TAG}-${TARGET}"
          BUNDLE_NAME="webserv-${TAG}-${TARGET}"
          cp webserv "dist/${BINARY_NAME}"
          chmod +x "dist/${BINARY_NAME}"

          mkdir -p "stage/${BUNDLE_NAME}/logs" "stage/${BUNDLE_NAME}/www/upload"
          cp webserv "stage/${BUNDLE_NAME}/webserv"
          cp -R conf "stage/${BUNDLE_NAME}/"
          cp -R www "stage/${BUNDLE_NAME}/"
          cp -R www2 "stage/${BUNDLE_NAME}/"
          cp README.md "stage/${BUNDLE_NAME}/"
          tar -C stage -czf "dist/${BUNDLE_NAME}.tar.gz" "${BUNDLE_NAME}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum webserv-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes
          fi
