<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Upload</title><link rel="stylesheet" href="/style.css"></head>
<body>
<h1>Upload files</h1>
<form action="/upload/" method="post" enctype="multipart/form-data">
<p><input type="file" name="file" multiple></p>
<p><button type="submit">Upload</button></p>
</form>
<p class="note">At most 5 files; a name that already exists is refused (409).</p>
<p><a href="/upload/">Uploaded files</a> | <a href="/">Home</a></p>
</body>
</html>
